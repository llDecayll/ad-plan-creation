<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ad Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Light theme is the default (data-theme="light" on <html>).
   To allow dark mode, remove that attribute; to force dark, set data-theme="dark". */
/* =========================================================
   DESIGN TOKENS — change these to restyle the whole plan.
   ========================================================= */
:root{
  --font: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --brand: #0866FF;          /* Meta blue */
  --brand-ink: #0A3E9C;
  --brand-soft: #E8F0FF;
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFD;
  --ink: #101828;
  --muted: #667085;
  --line: #D9E0EB;
  --dot: #9DB7E8;            /* dotted connector colour */
  --ok: #12A150; --ok-soft:#E3F6EA;
  --warn: #C27803; --warn-soft:#FFF3D6;
  --bad: #D92D20; --bad-soft:#FDE7E5;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 14px rgba(16,24,40,.06);
  --flow-base-h: 380px;      /* fixed height of a campaign flow (1-2 ad sets) */
  --row-h: 168;              /* px per ad-set row when a flow has several ad sets */
  --flow-h: var(--flow-base-h);
  --rail-w: 232px;           /* left platform/objective rail */
  --card-campaign: 228px;
  --card-adset: 220px;
  --card-ad: 210px;
  --col-gap: 56px;
  --lv-set: #6D3FD6;         /* ad set level colour */
  --lv-ad: #0E9F8A;          /* ad level colour */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#4D8DFF; --brand-ink:#B9D0FF; --brand-soft:#132544;
    --bg:#0B1220; --surface:#121A2B; --surface-2:#172136; --ink:#E7ECF5; --muted:#98A2B3;
    --line:#26324A; --dot:#3C5C99; --ok-soft:#0F2E1E; --warn-soft:#33270B; --bad-soft:#3A1512;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --brand:#4D8DFF; --brand-ink:#B9D0FF; --brand-soft:#132544;
  --bg:#0B1220; --surface:#121A2B; --surface-2:#172136; --ink:#E7ECF5; --muted:#98A2B3;
  --line:#26324A; --dot:#3C5C99; --ok-soft:#0F2E1E; --warn-soft:#33270B; --bad-soft:#3A1512;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
}
html{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1440px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
button{font-family:inherit}

/* ---------- Header ---------- */
.top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 28px}
.eyebrow{color:var(--brand);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.top h1{font-size:28px;margin:4px 0 8px}
.headline{color:var(--muted);max-width:760px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink);white-space:nowrap}
.chip b{font-weight:600;color:var(--muted)}
.ring{width:132px;height:132px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num{font-size:32px;font-weight:700;line-height:1}
.ring .lab{font-size:11px;color:var(--muted);margin-top:4px}

/* ---------- Journey strip ---------- */
.stages{display:flex;gap:8px;margin:20px 0 12px;overflow-x:auto;padding-bottom:4px}
.stage{flex:1 0 160px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;text-align:left;color:var(--ink)}
.stage .n{font-size:11px;color:var(--muted)}
.stage .t{font-weight:600}
.stage.has{border-color:var(--brand);background:var(--brand-soft)}
.stage .count{font-size:12px;color:var(--brand-ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:0 0 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;border-top:2px dotted var(--dot)}

/* ---------- Flow ---------- */
.flow{display:flex;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;height:var(--flow-h);overflow:hidden;scroll-margin-top:16px}
.flow.planned{opacity:.72}
.flow.planned .track{background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(127,127,127,.05) 10px 20px)}
.rail{flex:0 0 var(--rail-w);width:var(--rail-w);max-width:var(--rail-w);overflow:hidden;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.platform{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;align-self:flex-start;padding:5px 12px 5px 8px;border-radius:999px;color:#fff;background:var(--pc,#0866FF)}
.platform .dotc{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.9}
.rail .stg{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rail .obj{font-size:20px;font-weight:700;line-height:1.2}
.rail .goal{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rail .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.rail .foot .chip{white-space:normal;border-radius:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
.canvas{position:relative;display:grid;align-items:center;column-gap:var(--col-gap);padding:22px 28px;height:100%;min-width:max-content}
.canvas svg.links{position:absolute;inset:0;pointer-events:none;overflow:visible}
.colhead{position:absolute;top:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- Cards (80% visual / 20% text) ---------- */
.card{position:relative;z-index:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;text-align:left;padding:0;color:var(--ink);display:flex;flex-direction:column;overflow:hidden;transition:transform .12s ease, box-shadow .12s ease, border-color .12s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--brand);outline:none}
.card .vis{flex:1;min-height:0;position:relative;display:grid;place-items:center;color:#fff}
.card .txt{padding:8px 12px 10px}
.card .ttl{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tag{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.92);color:#101828;font-size:10px;font-weight:600;border-radius:999px;padding:2px 8px;letter-spacing:.04em}
.card .tag.r{left:auto;right:8px}
.card .lv{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 10px;font-size:10px;font-weight:700;letter-spacing:.12em;color:#fff;background:var(--lvc)}
.card .lv span:last-child{font-weight:600;letter-spacing:.02em;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .glyph{line-height:1}
.card .facts{margin-top:5px;display:flex;flex-direction:column;gap:2px}
.card .facts div{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Level 1: CAMPAIGN - platform colour, big rounded, thick border */
.card.campaign{--lvc:var(--pc,#0866FF);width:var(--card-campaign);height:min(280px, calc(var(--flow-h) - 60px));border:2px solid var(--pc,#0866FF);border-radius:18px}
.card.campaign .vis{background:linear-gradient(140deg,var(--pc,#0866FF),color-mix(in srgb,var(--pc,#0866FF) 55%, #000));flex-direction:column;gap:8px;display:flex;align-items:center;justify-content:center}
.card.campaign .glyph{font-size:34px}
.card.campaign .big{font-size:13px;font-weight:600;text-align:center;padding:0 16px;line-height:1.35}
.card.campaign .big small{display:block;font-weight:400;opacity:.85;margin-top:4px}
/* Level 2: AD SET - violet, medium radius, left accent */
.card.adset{--lvc:var(--lv-set);width:var(--card-adset);height:calc(100% - 8px);max-height:236px;border:1.5px solid var(--lv-set);border-radius:12px}
.card.adset .vis{background:linear-gradient(135deg,#6D3FD6,#9B6CF2);flex-direction:column;gap:2px;display:flex;align-items:center;justify-content:center;min-height:44px}
.card.adset .glyph{font-size:26px}
.card.adset .angle{font-size:11px;font-weight:600;opacity:.95}
/* Level 3: AD - teal, squarer, creative gradient */
.card.ad{--lvc:var(--lv-ad);width:var(--card-ad);height:calc(100% - 10px);max-height:156px;border:1.5px solid var(--lv-ad);border-radius:8px}
.card.ad .vis{background:var(--grad);min-height:50px}
.card.ad .glyph{font-size:30px;opacity:.95}
.card.ad .angle{position:absolute;bottom:8px;left:8px;right:8px;font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.colhead{display:flex;align-items:center;gap:6px;color:var(--lvc)}
.colhead::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--lvc)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-mid{background:var(--brand-soft);color:var(--brand-ink)}
.b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.status{background:var(--surface);border:1px dashed var(--muted);color:var(--muted)}

/* ---------- Drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);z-index:41;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h3{font-size:17px;flex:1}
.drawer .x{border:0;background:var(--surface-2);color:var(--ink);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:18px}
.drawer .body{padding:16px 20px 40px;overflow-y:auto}
.drawer h4{margin:18px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{width:100%;border-collapse:collapse;font-size:13px}
.kv td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}
.kv td:first-child{color:var(--muted);width:38%}
.kv .why{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.block{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:32px 12px 10px;font-size:13px;white-space:pre-wrap;position:relative}
.copy{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer}

/* ---------- Detail sections ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:28px 0 12px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.panel{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px}
.panel h3{font-size:16px;margin:18px 0 10px}
.panel h3:first-child{margin-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:8px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:2px solid var(--line);padding:8px}
.tbl td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
.tblwrap{overflow-x:auto}
.panel ul{margin:0 0 8px;padding-left:20px}
.panel li{margin:4px 0}
.panel p{margin:0 0 10px}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.foot-note{color:var(--muted);font-size:12px;margin-top:24px;text-align:center}

/* ---------- Mobile ---------- */
@media (max-width:760px){
  .top{grid-template-columns:1fr;padding:18px}
  .top h1{font-size:22px}
  .ring{width:104px;height:104px}
  .flow{flex-direction:column;height:auto}
  .rail{flex:none;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .rail .goal{-webkit-line-clamp:2}
  .track{height:var(--flow-h);flex:none}
  .panel{padding:16px}
}
@media print{.drawer,.scrim{display:none}.flow{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog">
  <header><h3 id="dTitle"></h3><button class="x" id="dClose" aria-label="Close">×</button></header>
  <div class="body" id="dBody"></div>
</aside>

<!-- PLAN DATA: replaced by scripts/render_plan.py -->
<script id="plan-data" type="application/json">/*__PLAN_DATA__*/</script>

<script>
(function(){
const DATA = JSON.parse(document.getElementById('plan-data').textContent);
const PLATFORM = {
  meta:{label:'Meta', c:'#0866FF'}, google:{label:'Google', c:'#1A73E8'}, youtube:{label:'YouTube', c:'#E62117'},
  tiktok:{label:'TikTok', c:'#111111'}, linkedin:{label:'LinkedIn', c:'#0A66C2'}, x:{label:'X', c:'#111111'},
  snapchat:{label:'Snapchat', c:'#D4C400'}, pinterest:{label:'Pinterest', c:'#E60023'}, microsoft:{label:'Microsoft', c:'#00A4EF'},
  amazon:{label:'Amazon', c:'#E47911'}, whatsapp:{label:'WhatsApp', c:'#1DAA61'}, other:{label:'Other', c:'#475467'}
};
const FORMAT_GLYPH = {video:'▶', image:'▣', carousel:'▦', collection:'▤', text:'Aa', search:'⌕', slideshow:'⧉', story:'▯'};
const GRADS = ['linear-gradient(140deg,#0866FF,#5B3FD6)','linear-gradient(140deg,#0E9F6E,#0866FF)','linear-gradient(140deg,#F59E0B,#E0465B)','linear-gradient(140deg,#7C3AED,#DB2777)','linear-gradient(140deg,#0F766E,#155E75)','linear-gradient(140deg,#334155,#0866FF)'];

const el=(tag,attrs={},kids=[])=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='text')n.textContent=v;else if(k==='style')n.setAttribute('style',v);else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else n.setAttribute(k,v)}(Array.isArray(kids)?kids:[kids]).forEach(c=>{if(c==null)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c)});return n};
const bandOf=s=>s>=80?['Launch as planned','b-ok']:s>=60?['Launch with fixes','b-mid']:s>=40?['Fix blockers / test','b-warn']:["Don't spend yet",'b-bad'];
const confPill=(s,prefix='')=>{if(s==null||s==='')return null;const[,c]=bandOf(+s);return el('span',{class:'pill '+c,title:bandOf(+s)[0]},prefix+s)};
const plat=k=>PLATFORM[(k||'other').toLowerCase()]||{label:k,c:'#475467'};

const app=document.getElementById('app'); const M=DATA.meta||{};
document.title=(M.client?M.client+' · ':'')+(M.title||'Ad Plan');

/* Header */
const score=+M.overallConfidence||0, [bandTxt,bandCls]=bandOf(score);
const R=56,C=2*Math.PI*R;
const ring=el('div',{class:'ring'});
ring.innerHTML=`<svg width="100%" height="100%" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--${bandCls==='b-ok'?'ok':bandCls==='b-mid'?'brand':bandCls==='b-warn'?'warn':'bad'})" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*score/100} ${C}"/></svg>`;
ring.appendChild(el('div',{class:'val'},[el('div',{},[el('div',{class:'num',text:String(score)}),el('div',{class:'lab',text:'confidence'})])]));
const chips=el('div',{class:'chips'});
(M.chips||[]).forEach(([k,v])=>chips.appendChild(el('span',{class:'chip'},[el('b',{text:k}),v])));
chips.appendChild(el('span',{class:'pill '+bandCls,text:bandTxt}));
app.appendChild(el('section',{class:'top'},[
  el('div',{},[el('div',{class:'eyebrow',text:(M.client||'')+(M.date?' · '+M.date:'')}),el('h1',{text:M.title||'Paid Ads Plan'}),el('div',{class:'headline',text:M.headline||''}),chips]),
  ring
]));

/* Journey strip */
const stages=DATA.stages||['Awareness','Consideration','Conversion','Retention'];
const sIdx=f=>{const i=stages.findIndex(s=>s.toLowerCase()===(f.stage||'').toLowerCase());return i<0?99:i};
const flows=(DATA.flows||[]).map((f,i)=>({f,i})).sort((a,b)=>sIdx(a.f)-sIdx(b.f)||((a.f.status||'launch')==='launch'?0:1)-((b.f.status||'launch')==='launch'?0:1)||a.i-b.i).map(x=>x.f);
const strip=el('nav',{class:'stages','aria-label':'Customer journey'});
stages.forEach((s,i)=>{const fs=flows.filter(f=>(f.stage||'').toLowerCase()===s.toLowerCase());
  strip.appendChild(el('button',{class:'stage'+(fs.length?' has':''),onclick:()=>{if(fs[0])document.getElementById('flow-'+fs[0].id).scrollIntoView({behavior:'smooth',block:'start'})}},[
    el('div',{class:'n',text:'Stage '+(i+1)}),el('div',{class:'t',text:s}),el('div',{class:'count',text:fs.length?fs.length+' campaign'+(fs.length>1?'s':''):'—'})]))});
app.appendChild(strip);
app.appendChild(el('div',{class:'legend'},[el('span',{},[el('i'),'Campaign → ad set → ads']),el('span',{text:'Click any card for full settings, prompts and copy'}),el('span',{text:'Scroll sideways inside a flow'})]));

/* Flows */
const linkJobs=[],colHeads=[];
const var_row=()=>parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h'))||196;
flows.forEach(f=>{
  const p=plat(f.platform); const adsets=f.adsets||[]; const spans=adsets.map(a=>Math.max(1,(a.ads||[]).length)); const n=Math.max(1,spans.reduce((t,x)=>t+x,0));
    /* fixed height per flow: base height, grows only when a flow has 3+ ad sets so cards never clip */
const flow=el('article',{class:'flow'+(f.status&&f.status!=='launch'?' planned':''),id:'flow-'+f.id,style:`--pc:${p.c};--flow-h:max(var(--flow-base-h), ${n*var_row()+56}px)`});
  const foot=el('div',{class:'foot'},[
    f.budget?el('span',{class:'chip',text:f.budget}):null,
    f.flight?el('span',{class:'chip',text:flightText(f.flight)}):null,
    confPill(f.confidence,''),
    f.status&&f.status!=='launch'?el('span',{class:'pill status',text:f.statusLabel||f.status}):null]);
  flow.appendChild(el('aside',{class:'rail'},[
    el('span',{class:'platform'},[el('span',{class:'dotc'}),p.label+(f.channel?' · '+f.channel:'')]),
    el('div',{class:'stg',text:f.stage||''}),
    el('div',{class:'obj',text:f.objective||''}),
    el('div',{class:'goal',text:f.goal||''}),
    foot]));
  const track=el('div',{class:'track'}); const cv=el('div',{class:'canvas'});
  cv.style.gridTemplateColumns=`var(--card-campaign) var(--card-adset) var(--card-ad)`;
  cv.style.gridTemplateRows=`repeat(${n}, 1fr)`;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','links'); cv.appendChild(svg);
  // Campaign card
  const c=f.campaign||{};
  const camp=el('button',{class:'card campaign',style:`grid-column:1;grid-row:1 / span ${n};align-self:center`,onclick:()=>openDrawer(c.name||'Campaign',campaignDetail(f))},[
    el('div',{class:'lv'},[el('span',{text:'CAMPAIGN'}),el('span',{text:f.budget||''})]),
    el('div',{class:'vis'},[el('span',{class:'glyph',text:'\u{1F4E3}'}),el('div',{class:'big'},[c.headline||f.objective||'',el('small',{text:c.optimise||''})])]),
    el('div',{class:'txt'},[el('div',{class:'ttl',text:c.name||''}),el('div',{class:'sub',text:c.sub||(adsets.length+' ad set'+(adsets.length===1?'':'s')+' \u00b7 '+adsets.reduce((t,a)=>t+(a.ads||[]).length,0)+' ads')})])]);
  cv.appendChild(camp);
  const firstAdset=[],firstAd=[];
  let row=1;
  adsets.forEach((a,i)=>{
    const sp=spans[i], r0=row; row+=sp;
    const facts=(a.facts||[]).slice(0,3); const nAds=(a.ads||[]).length;
    const as=el('button',{class:'card adset',style:`grid-column:2;grid-row:${r0} / span ${sp};align-self:center`,onclick:()=>openDrawer(a.name||'Ad set',adsetDetail(a))},[
      el('div',{class:'lv'},[el('span',{text:'AD SET '+(adsets.length>1?(i+1)+'/'+adsets.length:'')}),el('span',{text:nAds+' ad'+(nAds===1?'':'s')})]),
      el('div',{class:'vis'},[el('span',{class:'glyph',text:'\u{1F465}'}),a.audienceLabel?el('span',{class:'angle',text:a.audienceLabel}):null]),
      el('div',{class:'txt'},[el('div',{class:'ttl',text:a.name||''}),el('div',{class:'facts'},facts.map(([ic,t])=>el('div',{text:ic+' '+t}))),el('div',{class:'sub',style:'margin-top:4px'},[confPill(a.confidence,'')])])]);
    cv.appendChild(as); linkJobs.push([cv,svg,camp,as,'var(--lv-set)']); if(!i)firstAdset.push(as);
    (a.ads||[]).forEach((ad,j)=>{
      const fmt=(ad.format||'image').toLowerCase();
      const card=el('button',{class:'card ad',style:`grid-column:3;grid-row:${r0+j};--grad:${ad.color||GRADS[j%GRADS.length]}`,onclick:()=>openDrawer(ad.name||'Ad',adDetail(ad))},[
        el('div',{class:'lv'},[el('span',{text:'AD '+(j+1)}),el('span',{text:(ad.ratio||'').toUpperCase()})]),
        el('div',{class:'vis'},[el('span',{class:'glyph',text:FORMAT_GLYPH[fmt]||'\u25A3'}),el('span',{class:'angle',text:ad.angle||''})]),
        el('div',{class:'txt'},[el('div',{class:'ttl',text:ad.name||''}),el('div',{class:'sub',text:ad.format?ad.format[0].toUpperCase()+ad.format.slice(1):''})])]);
      cv.appendChild(card); linkJobs.push([cv,svg,as,card,'var(--lv-ad)']); if(!i&&!j)firstAd.push(card);
    });
  });
  [[camp,'CAMPAIGN','var(--pc)'],[firstAdset[0],'AD SETS','var(--lv-set)'],[firstAd[0],'ADS','var(--lv-ad)']].forEach(([card,t,col])=>{if(card)colHeads.push([cv,card,el('div',{class:'colhead',style:`--lvc:${col}`,text:t})])});
  if(!adsets.length){cv.appendChild(el('div',{class:'sub',style:'grid-column:2;color:var(--muted)',text:'Ad sets will be added when this campaign is funded.'}))}
  track.appendChild(cv); flow.appendChild(track); app.appendChild(flow);
});

function placeHeads(){colHeads.forEach(([cv,card,h])=>{if(!h.parentNode)cv.appendChild(h);h.style.left=card.offsetLeft+'px';h.style.top='6px'})}
function drawLinks(){placeHeads();
  const byCv=new Map(); linkJobs.forEach(j=>{if(!byCv.has(j[0]))byCv.set(j[0],[]);byCv.get(j[0]).push(j)});
  byCv.forEach((jobs,cv)=>{const svg=jobs[0][1]; svg.innerHTML=''; const o=cv.getBoundingClientRect();
    svg.setAttribute('width',cv.scrollWidth); svg.setAttribute('height',cv.offsetHeight);
    jobs.forEach(([, ,a,b,col])=>{const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
      const x1=A.right-o.left,y1=A.top+A.height/2-o.top,x2=B.left-o.left,y2=B.top+B.height/2-o.top,mx=(x1+x2)/2;
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      path.setAttribute('fill','none');path.setAttribute('stroke',col||'var(--dot)');path.setAttribute('stroke-width','2.5');
      path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-dasharray','0.1 7');
      svg.appendChild(path);
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',x2-1);dot.setAttribute('cy',y2);dot.setAttribute('r','3.5');dot.setAttribute('fill',col||'var(--brand)');svg.appendChild(dot);
    });});
}
window.addEventListener('resize',()=>requestAnimationFrame(drawLinks));
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(drawLinks));
setTimeout(drawLinks,300);

/* Drawer */
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
function openDrawer(title,nodes){document.getElementById('dTitle').textContent=title;const b=document.getElementById('dBody');b.innerHTML='';nodes.forEach(n=>n&&b.appendChild(n));drawer.classList.add('on');scrim.classList.add('on');drawer.setAttribute('aria-hidden','false');document.getElementById('dClose').focus()}
function closeDrawer(){drawer.classList.remove('on');scrim.classList.remove('on');drawer.setAttribute('aria-hidden','true')}
scrim.onclick=closeDrawer;document.getElementById('dClose').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
const H4=t=>el('h4',{text:t});
function kvTable(rows){if(!rows||!rows.length)return null;const t=el('table',{class:'kv'});rows.forEach(r=>{const[k,v,why,conf]=r;t.appendChild(el('tr',{},[el('td',{text:k}),el('td',{},[v||'',why?el('span',{class:'why',text:why}):null,conf!=null&&conf!==''?el('span',{style:'margin-left:6px'},[confPill(conf,'')]):null])]))});return t}
function copyBlock(text){if(!text)return null;const btn=el('button',{class:'copy',text:'Copy'});const d=el('div',{class:'block'},[text,btn]);btn.onclick=e=>{e.stopPropagation();navigator.clipboard&&navigator.clipboard.writeText(text).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy',1200)})};return d}
function list(items){if(!items||!items.length)return null;return el('ul',{},items.map(x=>el('li',{text:x})))}
function flightText(fl){return [fl.start&&fl.end?fl.start+' \u2192 '+fl.end:(fl.trigger||''),fl.days?fl.days+'d':''].filter(Boolean).join(' \u00b7 ')}
function flightRows(fl){if(!fl)return null;return [['Runs',flightText(fl)],fl.phases?['Phases',fl.phases]:null,fl.endAction?['At the end',fl.endAction]:null,fl.trigger&&fl.start?['Starts when',fl.trigger]:null].filter(Boolean)}
function campaignDetail(f){const c=f.campaign||{};return[
  el('div',{style:'display:flex;gap:6px;flex-wrap:wrap'},[el('span',{class:'chip',text:plat(f.platform).label}),el('span',{class:'chip',text:f.stage||''}),f.budget?el('span',{class:'chip',text:f.budget}):null,confPill(f.confidence,'Confidence ')]),
  f.goal?el('p',{text:f.goal,style:'margin:12px 0 0'}):null,
  f.flight?H4('Flight'):null,kvTable(flightRows(f.flight)),
  f.targets?H4('Targets and alert rules'):null,kvTable(f.targets),
  c.settings?H4('Settings'):null,kvTable(c.settings),
  f.forecast?H4('Forecast'):null,kvTable(f.forecast),
  c.raise?H4('What would raise confidence'):null,list(c.raise),
  c.notes?H4('Notes'):null,list(c.notes)]}
function adsetDetail(a){return[confPill(a.confidence,'Confidence '),a.settings?H4('Settings'):null,kvTable(a.settings),
  a.script?H4(a.scriptTitle||'Script'):null,copyBlock(a.script),a.form?H4('Lead form'):null,kvTable(a.form),a.notes?H4('Notes'):null,list(a.notes)]}
function adDetail(ad){return[
  el('div',{style:'display:flex;gap:6px;flex-wrap:wrap'},[ad.format?el('span',{class:'chip',text:ad.format}):null,ad.ratio?el('span',{class:'chip',text:ad.ratio}):null,ad.angle?el('span',{class:'chip',text:ad.angle}):null]),
  ad.why?H4('Why this format'):null,ad.why?el('p',{text:ad.why}):null,
  ad.prompt?H4('Generation prompt'):null,copyBlock(ad.prompt),
  ad.onscreen?H4('On-screen text'):null,copyBlock(ad.onscreen),
  ad.primaryText?H4('Primary text'):null,copyBlock(ad.primaryText),
  kvTable([ad.headline?['Headline',ad.headline]:null,ad.cta?['CTA',ad.cta]:null,ad.outcome?['Expected outcome',ad.outcome]:null,ad.policy?['Policy check',ad.policy]:null].filter(Boolean))]}

/* Detail sections */
const secs=DATA.sections||[];
if(secs.length){
  const tabs=el('div',{class:'tabs',role:'tablist'}); const panel=el('section',{class:'panel',role:'tabpanel'});
  const render=i=>{[...tabs.children].forEach((t,k)=>t.setAttribute('aria-selected',k===i?'true':'false'));panel.innerHTML='';
    (secs[i].blocks||[]).forEach(bk=>panel.appendChild(renderBlock(bk)))};
  secs.forEach((s,i)=>tabs.appendChild(el('button',{class:'tab',role:'tab',onclick:()=>render(i),text:s.title})));
  app.appendChild(tabs);app.appendChild(panel);render(0);
}
function renderBlock(bk){
  const frag=el('div');
  if(bk.title)frag.appendChild(el('h3',{text:bk.title}));
  if(bk.type==='table'){const t=el('table',{class:'tbl'});t.appendChild(el('tr',{},bk.headers.map(h=>el('th',{text:h}))));
    bk.rows.forEach(r=>t.appendChild(el('tr',{},r.map((c,k)=>{const td=el('td');if(bk.scoreCol===k&&c!==''&&!isNaN(+c)){td.appendChild(confPill(+c,''))}else td.textContent=c;return td}))));
    frag.appendChild(el('div',{class:'tblwrap'},[t]))}
  else if(bk.type==='list')frag.appendChild(list(bk.items));
  else if(bk.type==='steps')frag.appendChild(el('ol',{},bk.items.map(x=>el('li',{text:x}))));
  else if(bk.type==='code')frag.appendChild(copyBlock(bk.text));
  else frag.appendChild(el('p',{text:bk.text||''}));
  return frag}
if(M.footer)app.appendChild(el('div',{class:'foot-note',text:M.footer}));
})();
</script>
